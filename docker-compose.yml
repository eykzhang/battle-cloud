# Local development stack.
#
#   cp .env.example .env
#   docker compose --profile migrate run --rm migrate
#   docker compose up worker
#
# `up` starts postgres, the API on :8080, and one worker. `migrate` is a one-shot under
# its own profile so `up` does not report it as an exited service.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-battlecloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-battlecloud}
      POSTGRES_DB: ${POSTGRES_DB:-battlecloud}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Workers wait on this rather than on a sleep: a Postgres container accepts
      # connections some seconds after it starts, and a worker that connects too early
      # exits before the queue ever has anything in it.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-battlecloud} -d ${POSTGRES_DB:-battlecloud}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot. Runs under a profile so `docker compose up` does not try to start it as a
  # long-lived service and report it as exited.
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://battlecloud:battlecloud@postgres:5432/battlecloud}
    volumes:
      # Mounted so a new migration applies without a rebuild. The image carries its own
      # copy for deployments, where there is no source tree.
      - ./db:/app/db:ro
    command: ["up"]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://battlecloud:battlecloud@postgres:5432/battlecloud}
      SHOWDOWN_BASE_URL: ${SHOWDOWN_BASE_URL:-https://replay.pokemonshowdown.com/}
      REPLAY_MAX_BYTES: ${REPLAY_MAX_BYTES:-5242880}
      REPLAY_TIMEOUT_MS: ${REPLAY_TIMEOUT_MS:-20000}
      SUBMIT_RATE_LIMIT_PER_HOUR: ${SUBMIT_RATE_LIMIT_PER_HOUR:-20}
      # Part of the analysis identity, so it must match the tag the worker image was
      # built from. A mismatch misses the cache on every request rather than corrupting
      # anything, which makes it slow instead of wrong, and therefore easy to miss.
      POKE_ENGINE_TAG: ${POKE_ENGINE_TAG:-v0.0.48}
      # Also part of the identity, and stricter than the tag: a worker claims only jobs
      # whose dataset matches its own, so a wrong value here leaves submissions queued
      # rather than merely uncached.
      USAGE_STATS_DATASET: ${USAGE_STATS_DATASET:-2026-07}
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      additional_contexts:
        engine: ../battle-engine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://battlecloud:battlecloud@postgres:5432/battlecloud}
      # `docker compose run --rm -e WORKER_MODE=drain worker` processes whatever is
      # queued and exits, which is how the deployed per-burst task runs.
      WORKER_MODE: ${WORKER_MODE:-forever}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      # One search in flight per process, with this many native Rust threads inside it.
      # WORKER_CONCURRENCY x ENGINE_THREADS must not exceed the host's cores: the search
      # is budgeted in wall-clock time, so oversubscription returns weaker analyses
      # rather than slower ones. The worker refuses to start if it would.
      ENGINE_THREADS: ${ENGINE_THREADS:-4}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-900}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      # Left unset to use what the image baked in, which is what it was actually built
      # with. Override only to make a worker refuse work it could otherwise serve.
      POKE_ENGINE_TAG: ${POKE_ENGINE_TAG:-v0.0.48}
      USAGE_STATS_DATASET: ${USAGE_STATS_DATASET:-2026-07}
    # Scale with `docker compose up --scale worker=N`, keeping N x ENGINE_THREADS at or
    # under the host's core count.
    restart: unless-stopped

volumes:
  postgres-data:
