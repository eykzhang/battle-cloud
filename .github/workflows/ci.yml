name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: battlecloud
          POSTGRES_PASSWORD: battlecloud
          POSTGRES_DB: battlecloud
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U battlecloud -d battlecloud"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://battlecloud:battlecloud@localhost:5432/battlecloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply migrations
        run: |
          pip install "psycopg[binary]"
          python db/migrate.py up

      # The route and queue tests run against this Postgres rather than a fake. SKIP
      # LOCKED's behavior under concurrency cannot be verified by reading SQL.
      - name: API tests
        run: |
          npm --prefix api ci
          npm --prefix api run typecheck
          npm --prefix api test

      - name: Python tests
        run: |
          pip install pytest
          python -m pytest -q

  api-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          # Built on every pull request, published only from main. A pull request
          # proves the image builds; it has no business claiming a registry tag.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/eykzhang/battle-cloud-api:${{ github.sha }}
            ghcr.io/eykzhang/battle-cloud-api:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Record the digest
        if: ${{ steps.build.outputs.digest != '' }}
        run: echo "api ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  migrate-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the migration runner
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/migrate.Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/eykzhang/battle-cloud-migrate:${{ github.sha }}
            ghcr.io/eykzhang/battle-cloud-migrate:main
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
      - name: Record the digest
        if: ${{ steps.build.outputs.digest != '' }}
        run: echo "migrate ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  # Builds poke-engine from pinned source and runs the gen9 guard.
  #
  # It stops at the `engine-verified` target rather than building a complete worker
  # image, and the reason is narrow: battle-engine's .gitignore excludes `data/`, so the
  # 13.7 MB cached usage-stats file the runtime stage copies is not in a fresh clone.
  # Everything the guard needs is public, so the check that matters runs here; only the
  # final data layer cannot.
  #
  # The guard matters because the failure it catches is silent. poke-engine picks its
  # generation at compile time and the published PyPI wheel is a gen4 build that
  # simulates gen9ou with no error and no warning.
  gen9-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out battle-engine
        uses: actions/checkout@v4
        with:
          repository: eykzhang/battle-engine
          path: .battle-engine
      - uses: docker/setup-buildx-action@v3
      - name: Build the engine and run the gen9 guard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          target: engine-verified
          build-contexts: engine=.battle-engine
          push: false
          # Shared with worker-image below, which builds the same stages on top. Without
          # it the Rust extension compiles twice per push for no benefit.
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine

  # The image that actually gets deployed: `runtime`, which is the verified engine plus
  # the usage-stats file, the worker package and the queries.
  #
  # Separate from gen9-guard, and main-only, because it is the one job that depends on
  # smogon.com being up. The guard must keep running on every pull request whatever
  # Smogon is doing, since the failure it catches (a gen4 wheel simulating gen9 with no
  # error) is the one nobody would notice.
  worker-image:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [gen9-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Pinned, and it must stay pinned. `fetch_usage_stats.py` with no --month resolves
      # the newest month Smogon has published, so an unpinned build would silently change
      # the image's dataset the week a new month lands. Since the dataset is an identity
      # field and workers claim only jobs naming their own, the API would go on enqueueing
      # 2026-07 work that the new image refuses, and every submission would sit queued.
      #
      # This value, docker/worker.Dockerfile's ARG default, and .env.example are asserted
      # equal by worker/tests/test_contract_agreement.py.
      USAGE_STATS_DATASET: '2026-07'
    steps:
      - uses: actions/checkout@v4
      - name: Check out battle-engine
        uses: actions/checkout@v4
        with:
          repository: eykzhang/battle-engine
          path: .battle-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The 13.7 MB chaos file is gitignored in battle-engine, so a fresh clone does not
      # have it. This is the step that makes a complete worker image buildable anywhere
      # rather than only on a machine that has fetched it once.
      - name: Fetch the pinned usage-stats file
        run: |
          pip install requests
          python .battle-engine/scripts/fetch_usage_stats.py \
            --month "$USAGE_STATS_DATASET" --format gen9ou --cutoff 1500 \
            --out-dir .battle-engine/data/usage_stats
          ls -l ".battle-engine/data/usage_stats/${USAGE_STATS_DATASET}_gen9ou-1500.json"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          target: runtime
          build-contexts: engine=.battle-engine
          build-args: |
            USAGE_STATS_DATASET=${{ env.USAGE_STATS_DATASET }}
          push: true
          tags: |
            ghcr.io/eykzhang/battle-cloud-worker:${{ github.sha }}
            ghcr.io/eykzhang/battle-cloud-worker:main
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine

      # A deploy pins a digest rather than a tag: `main` moves, and an image that moves
      # under a running service is how a rollback stops being possible.
      - name: Record the digest
        run: echo "worker ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
