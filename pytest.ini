# Run both Python suites from the repo root:
#   DATABASE_URL=postgres:///battlecloud python -m pytest -q
#
# `pythonpath` is what lets worker/tests import battle_cloud_worker without the package
# being installed, and db/tests import its own conftest helpers. Without it the suites
# only work when pytest is invoked from inside their own directory, which is a trap for
# CI and for anyone running the whole thing at once.
[pytest]
testpaths = db/tests worker/tests
pythonpath = worker db/tests
